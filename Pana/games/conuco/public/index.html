<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6fae3f">
  <meta name="description" content="Tu casa y tu siembra">
  <title translate="no">Conuco · Pana</title>
  <link rel="stylesheet" href="/engine/kit.css">
  <link rel="stylesheet" href="/engine/ui.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/engine/game-lobby.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="world" aria-label="Tu conuco en tres dimensiones"></canvas>
  <!-- The plot has no match to set up: the shared entry loads it and stays out of the way. -->
  <section id="lobby" class="pk-lobby" hidden></section>
  <header class="topbar">
    <a class="pk-logo" href="/" aria-label="Volver a Pana">PANA</a>
    <div id="status" class="status">
      <div id="rank" class="rank-slot"></div>
      <span class="pk-chip mangos"><span id="mango-icon"></span><b id="mangos" class="pk-num">0</b></span>
      <nav id="game-nav" aria-label="Opciones"></nav>
    </div>
  </header>
  <div id="beds" class="beds"></div>
  <nav id="bar" class="bar" aria-label="Tu conuco">
    <button id="harvest-all" class="pk-btn pk-btn--primary" type="button" hidden></button>
    <button id="open-shop" class="pk-btn" type="button"></button>
    <button id="open-house" class="pk-btn" type="button"></button>
    <button id="open-decor" class="pk-btn" type="button"></button>
  </nav>
  <aside id="sheet" class="sheet pk-panel pk-panel--solid" hidden aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h2 id="sheet-title" class="pk-heading"></h2>
      <span id="sheet-note" class="sheet-note"></span>
      <button id="sheet-close" class="pk-btn pk-btn--sm" type="button" aria-label="Cerrar"></button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </aside>
  <div id="toast" class="pk-toast" role="status" aria-live="polite"></div>
  <div id="loading" class="pk-loading"><div class="pk-panel"><h2 class="pk-heading">Preparando Conuco</h2><p>Regando la tierra…</p></div></div>
  <script type="module" src="/engine/game-entry.js" data-pana-entry="./game.js"></script>
</body>
</html>
