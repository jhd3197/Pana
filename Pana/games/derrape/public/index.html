<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Derrape — un juego de Pana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- ---------- garage ---------- -->
  <div id="garage" class="screen">
    <header class="bar">
      <div class="brand">DERRAPE <span>garaje</span></div>
      <div class="hint">Arrastra para girar · rueda para acercar</div>
    </header>

    <aside class="card info">
      <div class="num" id="car-num"></div>
      <h1 id="car-name"></h1>
      <p id="car-blurb"></p>
      <p class="driver">Maneja: <b id="driver-name"></b> · <a href="/">cambiar mi pana</a></p>
      <dl id="stats"></dl>
      <div class="track-pick">
        <button id="t-prev" aria-label="Pista anterior">‹</button>
        <div class="t-info">
          <small>Pista</small>
          <b id="track-name"></b>
          <span id="track-blurb"></span>
        </div>
        <button id="t-next" aria-label="Pista siguiente">›</button>
      </div>
      <div class="pick">
        <button id="prev" aria-label="Carro anterior">‹</button>
        <div id="dots"></div>
        <button id="next" aria-label="Carro siguiente">›</button>
      </div>
      <button id="play" class="play">¡JUGAR!</button>
    </aside>

    <div class="tools">
      <button id="cam" class="toggle">Ver piloto</button>
      <button id="honk" class="toggle">¡Pita! <kbd>H</kbd></button>
      <button id="spin" class="toggle on">Girar</button>
    </div>
  </div>

  <!-- ---------- race ---------- -->
  <div id="race" class="screen hidden">
    <div class="hud-top">
      <div class="pill"><span class="ic">🏁</span><div><small>Vuelta</small><b id="lap">1/3</b></div></div>
      <div class="pill"><span class="ic">🏆</span><div><small>Posición</small><b id="pos">1/4</b></div></div>
      <div class="pill"><span class="ic">⏱️</span><div><small>Tiempo</small><b id="time">0.0</b></div></div>
      <div class="pill"><span class="ic">👑</span><div><small>Líder</small><b id="leader" class="small">—</b></div></div>
    </div>

    <div id="logo">DERRAPE<span>UN JUEGO DE PANA</span></div>

    <div class="minimap">
      <div class="mm-head"><b id="mm-track">El Estadio</b><small id="mm-sub">Circuito 1</small></div>
      <canvas id="mm" width="200" height="130"></canvas>
    </div>

    <ol id="board"></ol>

    <div id="item" class="item">
      <div class="slot"><span id="item-icon"></span><i id="item-n"></i></div>
      <small id="item-name">OBJETO</small>
    </div>

    <div id="speedo">
      <div class="kmh"><b id="speed">0</b><small>KM/H</small></div>
      <div id="boost"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="keys">
      <span><kbd>W</kbd> Acelerar</span>
      <span><kbd>S</kbd> Frenar</span>
      <span><kbd>Espacio</kbd> Objeto</span>
      <span><kbd>H</kbd> Claxon</span>
    </div>

    <div id="count"></div>

    <div id="result" class="card result hidden">
      <h1 id="result-title"></h1>
      <p id="result-time"></p>
      <div class="row">
        <button id="again" class="play">Otra vez</button>
        <button id="back">Garaje</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
