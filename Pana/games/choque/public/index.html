<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choque — un juego de Pana</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 12px; left: 12px; color: #fff;
      background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px; font-size: 14px;
    }
    #hud b { letter-spacing: .5px; }
    #players { margin-top: 6px; line-height: 1.6; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #help {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 13px; background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 8px;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <b>CHOQUE</b> · sala <span id="room"></span>
    <div id="players"></div>
  </div>
  <div id="help">WASD / flechas para manejar · choca a tus panas · comparte este link para que se unan</div>
  <script type="module" src="client.js"></script>
</body>
</html>
