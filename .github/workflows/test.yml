name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:
    inputs:
      changed_base:
        description: 'Run changed browser suites from this Git ref (empty runs the full nightly set)'
        required: false
        default: ''
        type: string
  # The full browser run, every night on dev (see browser-full).
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit and convention tests
        run: npm test

  # Every game in a real browser: prepares a 3D scene, shows the lobby, no errors.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Suites that already passed with these files
        uses: actions/cache/restore@v4
        with:
          path: Pana/tests/.browser-passes.json
          key: browser-passes-${{ github.job }}-${{ github.run_id }}
          restore-keys: browser-passes-
      - name: All games smoke
        run: node Pana/scripts/test-browser.js all-games.browser lobby.browser
      - name: Remember what passed
        if: always() && hashFiles('Pana/tests/.browser-passes.json') != ''
        uses: actions/cache/save@v4
        with:
          path: Pana/tests/.browser-passes.json
          key: browser-passes-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The suites for what this push or PR into dev touched, within a ~20 min
  # budget (Pana/scripts/changed-suites.js). Mandatory suites can exceed that
  # budget on engine migrations, so distribute them across eight serial runners.
  # PRs into main skip it: every commit already ran it on its way into dev.
  browser-changed:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.changed_base != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Suites that already passed with these files
        uses: actions/cache/restore@v4
        with:
          path: Pana/tests/.browser-passes.json
          key: browser-passes-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            browser-passes-${{ github.job }}-${{ matrix.shard }}-
            browser-passes-
      - name: Suites for what changed
        env:
          CHANGED_BASE: ${{ inputs.changed_base || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before) }}
          COMPARE_BASELINE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          baseline=()
          if [ "$COMPARE_BASELINE" = "true" ]; then baseline=("--baseline=$CHANGED_BASE"); fi
          node Pana/scripts/test-browser.js --jobs 1 --shard ${{ matrix.shard }}/8 --changed="$CHANGED_BASE" "${baseline[@]}"
      - name: Remember what passed
        if: always() && hashFiles('Pana/tests/.browser-passes.json') != ''
        uses: actions/cache/save@v4
        with:
          path: Pana/tests/.browser-passes.json
          key: browser-passes-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Every suite, split across four runners by Pana/tests/browser-timings.json
  # (refresh it with `npm run test:browser -- --record`). Nightly on dev and by
  # hand (Actions → Tests → Run workflow); never a merge gate, since a full run
  # takes most of an hour on hosted runners.
  browser-full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.changed_base == '')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Shard ${{ matrix.shard }} of 4
        run: node Pana/scripts/test-browser.js --jobs 2 --fresh --shard ${{ matrix.shard }}/4
