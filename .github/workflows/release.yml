name: Release

# Every push to main (a merge from dev) is a release:
#   1. the checks pass (test.yml);
#   2. the version is worked out: the first release is package.json's version, then a patch,
#      a minor when a commit since the last tag starts with "feat:", a major for "BREAKING CHANGE";
#   3. CHANGELOG.md's "## Unreleased" notes are stamped with that version and today's date, the
#      version goes into package.json, and both are committed back to main;
#   4. that commit is tagged v<version> and a GitHub release is published whose notes are the
#      version's changelog section.
# Each step is safe to rerun: an already-tagged commit is skipped, and stamping is idempotent.
# After a release, merge main back into dev so the stamped changelog comes along.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip a commit that is already released
        id: released
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Work out the version
        id: version
        if: steps.released.outputs.yes != 'true'
        run: |
          version="$(node Pana/scripts/changelog.js next)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists; bump package.json or add a commit." >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp the changelog and package.json, commit to main
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node Pana/scripts/changelog.js stamp "$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git diff --cached --quiet || git commit -m "Release v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Publish the GitHub release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node Pana/scripts/changelog.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "Pana v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
